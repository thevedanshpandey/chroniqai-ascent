<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">CHRONIQAI primary horizontal logo</title>
  <desc id="desc">White orbital symbol with a Core Blue diagonal orbit, vertical divider, CHRONIQAI wordmark, and AI Revenue Infrastructure descriptor on Midnight Black.</desc>
  <defs>
    <style>
      .white { fill: #FFFFFF; }
      .blue { fill: #2563FF; }
      .word { fill: #FFFFFF; font-family: "Montserrat", "Arial", sans-serif; font-size: 130px; font-weight: 800; letter-spacing: 5px; }
      .descriptor { fill: #FFFFFF; font-family: "Montserrat", "Arial", sans-serif; font-size: 28px; font-weight: 400; letter-spacing: 13px; }
    </style>
  </defs>
  <rect width="1600" height="420" fill="#080B12"/>
  <!-- Orbital symbol -->
  <path class="white" fill-rule="evenodd" d="
    M 248,55
    A 132,132 0 1 0 248,319
    A 132,132 0 0 0 248,55 Z
    M 248,91
    A 96,96 0 1 1 248,283
    A 96,96 0 0 1 248,91 Z"/>
  <path class="blue" d="M 83,254 C 132,229 282,176 417,150 C 391,176 239,228 83,254 Z"/>
  <rect x="472" y="76" width="3" height="222" class="white"/>
  <!-- Wordmark: CHRONIQ plus custom geometric A and I -->
  <text x="520" y="218" class="word">CHRONIQ</text>
  <path class="blue" d="M 1265,108 L 1357,232 L 1320,232 L 1265,158 L 1211,232 L 1174,232 Z"/>
  <path fill="#080B12" d="M 1265,181 L 1291,216 L 1239,216 Z"/>
  <rect x="1380" y="108" width="35" height="124" class="blue"/>
  <text x="560" y="286" class="descriptor">AI REVENUE INFRASTRUCTURE</text>
</svg>
